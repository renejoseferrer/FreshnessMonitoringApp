services:
  - type: web
    name: expiration-monitoring-app
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_PRODUCT_BUCKET
        value: product-photos
      - key: VITE_SUPABASE_ADMIN_OPERATORS_FUNCTION
        value: admin-operators
      - key: PORT
        value: 4000