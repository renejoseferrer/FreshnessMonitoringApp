services:
  - type: web
    name: expiration-monitoring-app
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_USERNAME
        sync: false
      - key: DEV_PASSWORD
        sync: false
      - key: STAFF_PASSWORD
        sync: false
    disk:
      name: expiration-monitor-data
      mountPath: /var/data
      sizeGB: 1